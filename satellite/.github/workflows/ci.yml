name: AST-OS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 mypy black pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f satellite/api/requirements.txt ]; then pip install -r satellite/api/requirements.txt; fi

    - name: Code Linting with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Code Formatting with black
      run: |
        black --check . --exclude "/(node_modules|\.git|\.next)/"

    - name: Static Type Checking with mypy
      run: |
        mypy satellite/ --ignore-missing-imports --allow-untyped-globals --disable-error-code=import-untyped

    - name: Run Pytest Suite (Physics & Stability)
      run: |
        pytest tests/ -v
