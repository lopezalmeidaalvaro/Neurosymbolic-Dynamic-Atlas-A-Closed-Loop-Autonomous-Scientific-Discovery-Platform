[project]
name = "autonomous-spacecraft-thermal-os"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "sympy>=1.12",
  "matplotlib>=3.8",
  "torch>=2.3",
  "torchdiffeq>=0.2",
  "PyYAML>=6.0",
  "tenacity",
  "fastapi>=0.110",
  "uvicorn>=0.28",
  "pydantic>=2.6",
  "reportlab>=4.1",
  "psutil>=5.9",
]

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = '''
/(
  \.git
  | \.venv
  | dashboard
)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
  ".git",
  ".venv",
  "dashboard",
  "__pycache__",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E501", "E731", "E741", "F401", "F402", "F811", "F823", "F841"]

[tool.vercel]
entrypoint = "backend.thermal_api:app"
