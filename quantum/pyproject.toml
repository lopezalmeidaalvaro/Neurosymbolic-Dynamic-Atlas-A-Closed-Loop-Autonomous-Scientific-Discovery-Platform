[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qade"
version = "0.1.0"
description = "Hardware-aware quantum compiler with fidelity-aware qubit placement"
readme = "README.md"
license = {text = "Proprietary"}
authors = [
  {name = "Alvaro Lopez Almeida"}
]
requires-python = ">=3.10"
dependencies = [
  "qiskit>=1.0.0",
  "qiskit-ibm-runtime>=0.20.0",
  "pyzx>=0.7.0",
  "numpy>=1.24.0",
  "scipy>=1.10.0",
]

[project.optional-dependencies]
qade = [
  "qiskit>=1.0.0",
  "qiskit-ibm-runtime>=0.20.0",
  "pyzx>=0.7.0",
  "numpy>=1.24.0",
  "scipy>=1.10.0",
]
api = [
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "pydantic>=2.0.0",
]
dev = [
  "pytest>=7.0.0",
  "pytest-cov",
]

[project.scripts]
qade = "quantum.cli:main"
qade-compile = "quantum.cli:compile_command_entry"
qade-benchmark = "quantum.cli:benchmark_command_entry"
qade-validate = "quantum.cli:validate_command_entry"

[tool.setuptools.packages.find]
where = [".."]
include = ["quantum*"]
