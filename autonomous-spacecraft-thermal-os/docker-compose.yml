version: '3.8'

services:
  # 🛰️ Spacecraft Thermal FastAPI Simulation API Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: thermal_api_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_DEBUG=True
      - API_DB_PATH=backend/auth.db
    restart: always

  # 🖥️ Next.js Cinematic Telemetry Observatory Dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: observatory_dashboard
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always
