seed: 42
paths:
  data_dir: data
  artifacts_dir: artifacts
  results_dir: results
  mitdb_dir: data/mitdb
  ucr_dir: data/ucr
systems:
  harmonic:
    n_timesteps: 120
    dt: 0.05
  lorenz:
    n_timesteps: 400
    dt: 0.01
    sigma: 10.0
    rho: 28.0
    beta: 2.6666666666666665
  rossler:
    n_timesteps: 400
    dt: 0.01
    a: 0.2
    b: 0.2
    c: 5.7
  duffing:
    n_timesteps: 400
    dt: 0.01
    alpha: 1.0
    beta: -1.0
    gamma: 0.3
    delta: 0.2
    omega: 1.2
neural_ode:
  train_steps: 160
  epochs: 40
  lr: 0.01
  hidden_dim: 32
  num_layers: 2
symbolic:
  threshold: 1.0e-06
  polynomial_order: 1
orchestrator:
  log_level: INFO
  overwrite_results: true
  save_plots: true
scientific_guard:
  blocked_phrases:
  - theory of everything
  - proof of quantum gravity
  - discovered fundamental law
  - real spacetime
  - unified field theory
  - quantum spacetime emergence proven
  - hawking radiation confirmed
  - holographic principle verified
physics:
  random_seed: 42
  default_timeout: 300
  sanity_min_score: 0.75
  skeptic:
    minimum_required_replications: 3
    rerun_seeds:
    - 7
    - 13
    - 23
    - 42
    - 101
models:
  scientific_embedding_model: allenai/specter2_base
  scibert_model: allenai/scibert_scivocab_uncased
  embedding_cache: physics/models/embeddings_cache/
