seed: 42

paths:
  data_dir: ${DATA_DIR:-data}
  artifacts_dir: ${ARTIFACTS_DIR:-artifacts}
  results_dir: ${RESULTS_DIR:-results}
  mitdb_dir: ${MITDB_DIR:-data/mitdb}
  ucr_dir: ${UCR_DIR:-data/ucr}

systems:
  harmonic:
    n_timesteps: 120
    dt: 0.05
  lorenz:
    n_timesteps: 400
    dt: 0.01
    sigma: 10.0
    rho: 28.0
    beta: 2.6666666666666665
  rossler:
    n_timesteps: 400
    dt: 0.01
    a: 0.2
    b: 0.2
    c: 5.7
  duffing:
    n_timesteps: 400
    dt: 0.01
    alpha: 1.0
    beta: -1.0
    gamma: 0.3
    delta: 0.2
    omega: 1.2

neural_ode:
  train_steps: 160
  epochs: 40
  lr: 0.01
  hidden_dim: 32
  num_layers: 2

symbolic:
  threshold: 1.0e-6
  polynomial_order: 1

orchestrator:
  log_level: INFO
  overwrite_results: true
  save_plots: true

scientific_guard:
  blocked_phrases:
  - theory of everything
  - proof of quantum gravity
  - discovered fundamental law
  - real spacetime
  - unified field theory
  - quantum spacetime emergence proven
  - hawking radiation confirmed
  - holographic principle verified

physics:
  random_seed: 42
  default_timeout: 300

models:
  scientific_embedding_model: allenai/specter2_base
  scibert_model: allenai/scibert_scivocab_uncased
  embedding_cache: physics/models/embeddings_cache/
