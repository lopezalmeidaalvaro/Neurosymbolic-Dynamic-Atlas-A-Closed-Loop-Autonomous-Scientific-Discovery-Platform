# ==============================================================================
# Spacecraft Thermal OS (AST-OS) - Production SaaS Compose Setup
# Description: Connects API backend with Redis and PostgreSQL/TimescaleDB.
# ==============================================================================

version: '3.8'

services:
  # 1. TimescaleDB (PostgreSQL 16) for telemetry timeseries storage
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: astos_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autosspacepass987}
      POSTGRES_DB: ${POSTGRES_DB:-astos_telemetry}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis for caching transient simulation trajectories
  redis:
    image: redis:7-alpine
    container_name: astos_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redissecurepass123}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. FastAPI Python SaaS Application
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astos_fastapi
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autosspacepass987}
      POSTGRES_DB: ${POSTGRES_DB:-astos_telemetry}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redissecurepass123}
      JWT_SECRET: ${JWT_SECRET:-ASTOS_PRODUCTION_SECURE_TOKEN_SECRET_XYZ_98765}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_mockkeyxyz}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_mockwebhookxyz}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
